; Waveshare ESP32-S3-ePaper-1.54(G) -- four-colour 200x200 e-paper.
; Driver from waveshareteam/ESP32-S3-ePaper-1.54G (ESP-IDF 5.5.1 example 09).

[env:yuktrivia]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
; Pin the port: auto-detect has picked a Bluetooth audio device when the board
; is deep sleeping and its USB port is gone.
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
board_build.flash_mode = qio
; Board has 8MB flash; the default 1MB app partition is too tight with TLS.
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

; The vendor driver/GUI code trips a few warnings, and PlatformIO leaks
; C-only flags into C++ compiles, so don't treat warnings as errors.
build_unflags = -Werror
build_flags =
    -Wno-error
    -Wno-type-limits
